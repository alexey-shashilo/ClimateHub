# Climate Hub - Local Development Mosquitto Configuration
# WARNING: For local development only. NOT for production use.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

max_queued_messages 1000
max_inflight_messages 20

connection_messages true