# Climate Hub - Local Development Mosquitto Configuration
# Password authentication required (use mqtt_passwd tool to generate mosquitto.passwd)

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

max_queued_messages 1000
max_inflight_messages 20

connection_messages true