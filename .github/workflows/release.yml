name: Release

on:
  push:
    branches: [main]

jobs:
  full-test-suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climate_hub_test
          POSTGRES_USER: climate_hub
          POSTGRES_PASSWORD: climate_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --warningsaserrors

      - name: Architecture Tests
        run: dotnet test --no-build --filter "FullyQualifiedName~ArchitectureTests"

      - name: Unit Tests
        run: dotnet test --no-build --filter "FullyQualifiedName~UnitTests"

      - name: Smoke Tests
        run: dotnet test --no-build --filter "FullyQualifiedName~SmokeTests"
        env:
          Postgres__ConnectionString: "Host=localhost;Port=5432;Database=climate_hub_test;Username=climate_hub;Password=climate_hub_ci"

      - name: Integration Tests
        run: dotnet test --no-build --filter "FullyQualifiedName~IntegrationTests"
        env:
          Postgres__ConnectionString: "Host=localhost;Port=5432;Database=climate_hub_test;Username=climate_hub;Password=climate_hub_ci"

      - name: Vulnerability Scan
        run: dotnet list package --vulnerable --include-transitive

      - name: Format Check
        run: dotnet format --verify-no-changes --no-restore

  mqtt-tests:
    runs-on: ubuntu-latest
    needs: full-test-suite

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build

      - name: MQTT Component Tests
        run: dotnet test --filter "FullyQualifiedName~MqttComponentTests"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: full-test-suite

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build

      - name: End-to-End Tests
        run: dotnet test --filter "Category=E2E"

  frontend:
    runs-on: ubuntu-latest
    needs: full-test-suite
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: TypeCheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx oxlint --allow-warnings

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [mqtt-tests, e2e-tests, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore --warningsaserrors

      - name: Publish API
        run: dotnet publish src/ClimateHub.Api/ClimateHub.Api.csproj -c Release -o artifacts/api

      - name: Publish DeviceGateway
        run: dotnet publish src/ClimateHub.DeviceGateway/ClimateHub.DeviceGateway.csproj -c Release -o artifacts/device-gateway

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 30

      - name: Build Docker API
        run: |
          docker build -t climate-hub/api:latest -f deploy/Dockerfile.api .

      - name: Build Docker DeviceGateway
        run: |
          docker build -t climate-hub/device-gateway:latest -f deploy/Dockerfile.device-gateway .