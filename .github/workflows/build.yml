name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build
      - name: Architecture Tests
        run: dotnet test tests/ClimateHub.ArchitectureTests
      - name: Device Gateway Tests
        run: dotnet test tests/ClimateHub.DeviceGatewayTests
      - name: Runtime Metrics Tests
        run: dotnet test tests/ClimateHub.RuntimeMetricsTests
      - name: Hardware Abstraction Tests
        run: dotnet test tests/ClimateHub.HardwareAbstractionTests
      - name: Deployment Config Tests
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "Category=Deployment"

  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build
      - name: All Unit Tests
        run: |
          for proj in tests/ClimateHub.Modules.*.UnitTests; do
            if [ -d "$proj" ]; then dotnet test "$proj"; fi
          done

  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build