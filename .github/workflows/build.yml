name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore and Build
        run: dotnet build
      - name: Architecture Tests
        run: dotnet test tests/ClimateHub.ArchitectureTests --logger "trx;LogFileName=architecture.trx"
      - name: Unit Tests
        run: |
          for proj in tests/ClimateHub.Modules.*.UnitTests; do
            if [ -d "$proj" ]; then dotnet test "$proj" --logger "trx;LogFileName=$(basename $proj).trx"; fi
          done
      - name: Device Gateway Tests
        run: dotnet test tests/ClimateHub.DeviceGatewayTests --logger "trx;LogFileName=gateway.trx"
      - name: Runtime Metrics Tests
        run: dotnet test tests/ClimateHub.RuntimeMetricsTests --logger "trx;LogFileName=metrics.trx"
      - name: Hardware Abstraction Tests
        run: dotnet test tests/ClimateHub.HardwareAbstractionTests --logger "trx;LogFileName=hal.trx"
      - name: Deployment Config Tests
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "Category=Deployment" --logger "trx;LogFileName=deploy-config.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Lint & TypeCheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build