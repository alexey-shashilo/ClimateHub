name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build
      - name: Architecture Tests
        run: dotnet test tests/ClimateHub.ArchitectureTests
      - name: Unit Tests
        run: |
          for proj in tests/ClimateHub.Modules.*.UnitTests; do
            if [ -d "$proj" ]; then dotnet test "$proj"; fi
          done
      - name: Gateway, Metrics, HAL Tests
        run: |
          dotnet test tests/ClimateHub.DeviceGatewayTests
          dotnet test tests/ClimateHub.RuntimeMetricsTests
          dotnet test tests/ClimateHub.HardwareAbstractionTests
          dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "Category=Deployment"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build