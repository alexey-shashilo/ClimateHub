name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climate_hub_test
          POSTGRES_USER: climate_hub
          POSTGRES_PASSWORD: climate_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Vulnerability Scan
        run: dotnet list package --vulnerable --include-transitive
      - name: Architecture Tests
        run: |
          echo "=== Diagnostic ==="
          echo "OS: $(uname -a)"
          echo "PWD: $(pwd)"
          echo "Sln: $(ls ClimateHub.sln 2>&1)"
          echo "ArchTests: $(ls tests/ClimateHub.ArchitectureTests/bin/Debug/net9.0/*.dll 2>&1)"
          echo "=== Running Architecture Tests ==="
          dotnet test tests/ClimateHub.ArchitectureTests --logger "trx;LogFileName=architecture.trx" -v d 2>&1
      - name: Unit Tests
        run: dotnet test tests/ClimateHub.UnitTests --logger "trx;LogFileName=unit.trx"
      - name: Device Gateway Tests
        run: dotnet test tests/ClimateHub.DeviceGatewayTests --logger "trx;LogFileName=gateway.trx"
      - name: Runtime Metrics Tests
        run: dotnet test tests/ClimateHub.RuntimeMetricsTests --logger "trx;LogFileName=metrics.trx"
      - name: Hardware Abstraction Tests
        run: dotnet test tests/ClimateHub.HardwareAbstractionTests --logger "trx;LogFileName=hal.trx"
      - name: Deployment Config Tests
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "Category=Deployment" --logger "trx;LogFileName=deploy-config.trx"
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7
      - name: Publish API
        run: dotnet publish src/ClimateHub.Api/ClimateHub.Api.csproj -c Release -o artifacts/api --no-restore
      - name: Publish DeviceGateway
        run: dotnet publish src/ClimateHub.DeviceGateway/ClimateHub.DeviceGateway.csproj -c Release -o artifacts/device-gateway --no-restore
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Lint & TypeCheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build