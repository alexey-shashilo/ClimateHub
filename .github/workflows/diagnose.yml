name: Diagnose Build Failure

on:
  push:
    branches: [diagnose/**]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: dotnet build
        run: dotnet build 2>&1
      - name: Architecture Tests
        run: dotnet test tests/ClimateHub.ArchitectureTests 2>&1
      - name: Gateway Tests
        run: dotnet test tests/ClimateHub.DeviceGatewayTests 2>&1
      - name: Metrics Tests
        run: dotnet test tests/ClimateHub.RuntimeMetricsTests 2>&1
      - name: HAL Tests
        run: dotnet test tests/ClimateHub.HardwareAbstractionTests 2>&1
      - name: Deployment Config Tests
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "Category=Deployment" 2>&1
      - name: Report
        run: echo "ALL STEPS COMPLETED"