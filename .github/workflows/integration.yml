name: Integration and E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]

jobs:
  mqtt-tests:
    runs-on: ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:2.0.20
        ports:
          - 1883:1883
        options: >-
          --health-cmd "timeout 5 mosquitto_sub -t test -C 1 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and Test
        run: dotnet test tests/ClimateHub.MqttComponentTests --logger "trx;LogFileName=mqtt.trx"

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climate_hub_e2e
          POSTGRES_USER: climate_hub
          POSTGRES_PASSWORD: climate_hub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mosquitto:
        image: eclipse-mosquitto:2.0.20
        ports:
          - 1883:1883
      influxdb:
        image: influxdb:2.7.11-alpine
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
          DOCKER_INFLUXDB_INIT_ORG: climate-hub
          DOCKER_INFLUXDB_INIT_BUCKET: climate-hub
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: e2e-test-token-e2e
        ports:
          - 8086:8086
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Wait for dependencies
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "Postgres ready" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            nc -z localhost 1883 && echo "Mosquitto ready" && break
            sleep 2
          done
      - name: Build and Test
        run: dotnet test tests/ClimateHub.EndToEndTests --filter "Category=E2E" --logger "trx;LogFileName=e2e.trx"

  recovery-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: climate_hub_recovery
          POSTGRES_USER: climate_hub
          POSTGRES_PASSWORD: climate_hub_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mosquitto:
        image: eclipse-mosquitto:2.0.20
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Wait for dependencies
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "Postgres ready" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            nc -z localhost 1883 && echo "Mosquitto ready" && break
            sleep 2
          done
      - name: Build and Test
        run: dotnet test tests/ClimateHub.RuntimeRecoveryTests --logger "trx;LogFileName=recovery.trx"

  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and Test (Backup/Restore)
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "FullyQualifiedName~BackupRestoreTests" --logger "trx;LogFileName=backup.trx"
      - name: Build and Test (Full Stack)
        run: dotnet test tests/ClimateHub.DeploymentVerificationTests --filter "FullyQualifiedName~DeploymentVerificationTests&!Category=Deployment" --logger "trx;LogFileName=deploy-full.trx"

  required-checks-complete:
    runs-on: ubuntu-latest
    needs: [mqtt-tests, e2e-tests, recovery-tests, deployment-tests]
    if: always()
    steps:
      - name: Check Build Status
        run: |
          echo "MQTT: ${{ needs.mqtt-tests.result }} | E2E: ${{ needs.e2e-tests.result }} | Recovery: ${{ needs.recovery-tests.result }} | Deploy: ${{ needs.deployment-tests.result }}"
          if [ "${{ needs.mqtt-tests.result }}" = "success" ] && \
             [ "${{ needs.e2e-tests.result }}" = "success" ] && \
             [ "${{ needs.recovery-tests.result }}" = "success" ] && \
             [ "${{ needs.deployment-tests.result }}" = "success" ]; then
            echo "All integration checks passed"
          else
            echo "Some checks failed"
            exit 1
          fi