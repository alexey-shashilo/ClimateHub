name: Integration and E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, remediation/**]

jobs:
  mqtt-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build

      - name: MQTT Component Tests
        run: dotnet test --filter "FullyQualifiedName~MqttComponentTests"

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build

      - name: Migration Verification
        run: dotnet test --filter "FullyQualifiedName~MigrationVerification"
        env:
          Postgres__ConnectionString: "Host=localhost;Port=5432;Database=climate_hub_test;Username=climate_hub;Password=climate_hub_ci"

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build

      - name: End-to-End Tests
        run: dotnet test --filter "Category=E2E"